<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kanban + Pomodoro</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    #themeToggle {
      float: right;
      margin-top: -2.5rem;
      margin-right: 1rem;
      background: #0056b3;
      color: white;
      padding: 0.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .kanban-container {
      display: flex;
      justify-content: space-around;
      margin: 2rem;
    }
    .column {
      width: 30%;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    .task-list {
      min-height: 150px;
      margin-top: 1rem;
      border: 1px dashed #ccc;
      padding: 0.5rem;
    }
    .task {
      background: #eee;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border-radius: 5px;
    }
    #pomodoro {
      text-align: center;
      margin: 2rem;
    }
    #pomodoro button {
      padding: 0.5rem 1rem;
      margin: 1rem;
      background: #28a745;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .dark-mode {
      background: #222;
      color: #eee;
    }
    .dark-mode .column {
      background: #333;
      box-shadow: 0 0 10px #111;
    }
    .image-input {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mini Kanban Board + Pomodoro</h1>
    <button id="themeToggle">Toggle Theme</button>
  </header>

  <main class="kanban-container">
    <section class="column" id="todo">
      <h2>To Do</h2>
      <div class="task-list" id="todoTasks"></div>
      <button onclick="addTask('todo')">Add Task</button>
    </section>

    <section class="column" id="inprogress">
      <h2>In Progress</h2>
      <div class="task-list" id="inprogressTasks"></div>
      <button onclick="addTask('inprogress')">Add Task</button>
    </section>

    <section class="column" id="done">
      <h2>Done</h2>
      <div class="task-list" id="doneTasks"></div>
      <button onclick="addTask('done')">Add Task</button>
    </section>
  </main>

  <section id="pomodoro">
    <h2>Pomodoro Timer</h2>
    <div id="timer">25:00</div>
    <button onclick="startPomodoro()">Start</button>
    <button onclick="resetPomodoro()">Reset</button>
  </section>

  <script>
    // Theme toggle
    document.getElementById('themeToggle').onclick = () => {
      document.body.classList.toggle('dark-mode');
    };

    // Task handling
    function addTask(section) {
      const taskText = prompt("Enter task title:");
      if (!taskText) return;
      const imageInput = document.createElement("input");
      imageInput.type = "file";
      imageInput.accept = "image/*";
      imageInput.className = "image-input";

      const task = document.createElement("div");
      task.className = "task";
      task.textContent = taskText;

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "❌";
      deleteBtn.style.float = "right";
      deleteBtn.onclick = () => task.remove();

      task.appendChild(deleteBtn);
      task.appendChild(document.createElement("br"));
      task.appendChild(imageInput);

      document.getElementById(section + "Tasks").appendChild(task);
    }

    // Pomodoro timer
    let timer;
    let totalTime = 25 * 60;
    function startPomodoro() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (totalTime <= 0) {
          clearInterval(timer);
          alert("Pomodoro complete!");
          return;
        }
        totalTime--;
        const minutes = Math.floor(totalTime / 60).toString().padStart(2, '0');
        const seconds = (totalTime % 60).toString().padStart(2, '0');
        document.getElementById("timer").textContent = `${minutes}:${seconds}`;
      }, 1000);
    }

    function resetPomodoro() {
      clearInterval(timer);
      totalTime = 25 * 60;
      document.getElementById("timer").textContent = "25:00";
    }
  </script>
</body>
</html>
